<title>Campus Backlot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Big+Shoulders+Stencil+Display:wght@800&family=Bitter:wght@500;700&family=Caveat:wght@600&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one 1600x900 stage, letterboxed and scaled to the window; each beat swaps the stage's scene. Single deliberate dark look (a dark theater around the screen). */
:root{
  --house:#0d0f12; --paper:#F3EBD8; --kraft:#C9A06E; --kraftD:#9E7650; --lumber:#B88A4A; --lumberD:#8C6A48;
  --brass:#D9AE3F; --red:#C8463F; --shade:#0b0e13; --ul:rgba(25,18,10,.32); --ink:#3a2a1c;
  --sign:"Alfa Slab One", "Rockwell", Georgia, serif;
  --stencil:"Big Shoulders Stencil Display", "Impact", "Arial Narrow", sans-serif;
  --label:"Bitter", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--house);color:var(--paper);overflow:hidden;font-family:var(--label)}
#viewport{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#000}
.layer{position:absolute;inset:0;width:1600px;height:900px}
svg{display:block;width:1600px;height:900px}
.world{transform-origin:800px 560px}
.close{opacity:0;perspective:1200px;perspective-origin:50% 35%}
.piece{position:absolute;overflow:hidden;transform-style:preserve-3d;backface-visibility:hidden}
.piece svg{position:absolute;left:0;top:0}
.sign{font-family:var(--sign)}
.sten{font-family:var(--stencil);letter-spacing:.06em}
.lbl{font-family:var(--label);font-weight:700}
.sub{font-family:var(--label);font-weight:500}
.tw{font-family:"Courier Prime","Courier New",monospace}
.after .op{animation:flinch .6s var(--fd,1.5s) steps(7) both}
@keyframes flinch{0%{transform:none}25%{transform:translateY(-16px)}55%{transform:translateY(3px)}100%{transform:none}}

/* shadow hands appear at the collapse */
.hand{opacity:0}
.after .hand{opacity:.9;transition:opacity .4s 1.2s steps(5)}
.after .f-hold ~ .hand,.after .hold-hand{transition-delay:3.4s}
.q{opacity:0}
.after .q{opacity:1;transition:opacity .3s 1.3s steps(4)}

/* ambient loops */
.loop{animation-iteration-count:infinite}
@media (prefers-reduced-motion:reduce){.loop,.edge{animation-play-state:paused!important}}

/* HUD */
#hud{position:fixed;left:12px;bottom:10px;font:500 13px/1.5 var(--label);color:#8a8f98;background:rgba(13,15,18,.85);padding:8px 12px;border-radius:6px;pointer-events:none}
#hint{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);font:700 18px var(--label);color:var(--paper);background:rgba(13,15,18,.78);padding:12px 20px;border-radius:8px;pointer-events:none;text-align:center}
#hint small{display:block;font-weight:500;font-size:14px;color:#b9b3a4;margin-top:4px}

/* ---------- classroom: one continuous camera ---------- */
.cw{transform-origin:800px 470px;perspective:1400px;perspective-origin:800px 470px}
.cl-bs{transform-origin:0 0;transform:translate(671.43px,402.14px) scale(.16071)}
.cl-bsclip{clip-path:inset(428px 741px 278px 741px)}
.cl-a .cw{animation:clWalk 1.2s steps(14,jump-none) both}
@keyframes clWalk{from{transform:translateY(40px) scale(.85)}to{transform:none}}
.cl-b .cw{animation:clPush 1.6s steps(19) both}
@keyframes clPush{from{transform:none}to{transform:scale(5.6)}}
.door-l,.door-r{transform-box:fill-box}.door-l{transform-origin:left center}.door-r{transform-origin:right center}
.cl-b .door-l,.cl-b .door-r{animation:clDoor .5s 1.5s steps(6) both}
@keyframes clDoor{to{transform:scaleX(.12)}}
.cl-c .door-l,.cl-c .door-r{transform:scaleX(.12)}
.cl-c .cw{transform:scale(5.6)}
@keyframes clPull{from{transform:scale(5.6)}to{transform:scale(1.5)}}

@keyframes clBsGrow{from{transform:translate(671.43px,402.14px) scale(.16071)}to{transform:translate(266.67px,156.67px) scale(.66667)}}
.cl-c .cl-bsclip{animation:clClipOpen .01s .4s both}@keyframes clClipOpen{to{clip-path:inset(0px 0px 0px 0px)}}
@keyframes clClip{0%{clip-path:inset(428px 741px 278px 741px)}20%{clip-path:inset(58px 278px 261px 278px)}45%,100%{clip-path:inset(0px 0px 0px 0px)}}
.cl-c .cl-facade{transform-origin:800px 639px;animation:clFall 1.4s .6s steps(17) both}
@keyframes clFall{0%{transform:none}18%{transform:rotateX(-5deg)}99%{transform:rotateX(-94deg);opacity:1}100%{transform:rotateX(-94deg);opacity:0}}
.cl-c .cl-sky{animation:clFly 1s 1s steps(12) both}@keyframes clFly{to{transform:translateY(-1100px)}}
.cl-c .cl-hills{transform-origin:800px 470px;animation:clTip 1s 1.1s steps(12) both}@keyframes clTip{to{transform:rotateX(85deg);opacity:0}}
.cl-c .hand{opacity:0;animation:clShowH .01s .7s both}.cl-c .q{opacity:0;animation:clShowQ .01s 2.2s both}.cl-c{--fd:3s}@keyframes clShowH{to{opacity:.9}}@keyframes clShowQ{to{opacity:1}}
@keyframes clDrift{from{transform:translateX(-80px)}to{transform:translateX(420px)}}
@keyframes clWave{0%,100%{transform:skewY(0deg) scaleX(1)}25%{transform:skewY(-6deg) scaleX(.94)}50%{transform:skewY(2deg) scaleX(1.03)}75%{transform:skewY(5deg) scaleX(.96)}}
@keyframes clRipple{0%,100%{transform:skewY(0deg)}30%{transform:skewY(-.5deg)}65%{transform:skewY(.4deg)}}
@keyframes clSec{to{transform:rotate(360deg)}}
.frozen .edge{animation-play-state:paused!important}
.after .op.hop{animation:hop .6s steps(7) both}@keyframes hop{0%{transform:none}25%{transform:translateY(-16px)}55%{transform:translateY(3px)}100%{transform:none}}
/* fall styles: classroom falls forward (above); cafeteria peels in strips; dorm is yanked up; library folds, then falls; bookstore holds */
.cl-c.fall-peel .cl-facade{animation:none}
.cl-c.fall-peel .pl{animation:plPeel 1.3s steps(16) both}
@keyframes plPeel{0%{transform:none}30%{transform:rotate(var(--r))}100%{transform:translateY(760px) rotate(calc(var(--r) * 3))}}
.cl-c.fall-fly .cl-facade{animation:flyF 1.3s .5s steps(16) both}
@keyframes flyF{0%{transform:none}22%{transform:translateY(8px)}100%{transform:translateY(-820px)}}
.bk-l{clip-path:inset(0 799px 0 0);transform-origin:278px 470px;backface-visibility:hidden}
.bk-r{clip-path:inset(0 0 0 800px);transform-origin:1322px 470px;backface-visibility:hidden}
.cl-c.fall-book .cl-facade{transform-style:preserve-3d;animation:none}
.cl-c.fall-book .bk-l{animation:bookL 1.9s .5s steps(23) both}
.cl-c.fall-book .bk-r{animation:bookR 1.9s .5s steps(23) both}
@keyframes bookL{0%{transform:none}12%{transform:rotateY(-3deg)}100%{transform:rotateY(105deg)}}
@keyframes bookR{0%{transform:none}12%{transform:rotateY(3deg)}100%{transform:rotateY(-105deg)}}
.cl-c.fall-hold .cl-bsclip{animation:none}
.cl-c.fall-hold .cl-sky,.cl-c.fall-hold .cl-hills{animation:none}
.cl-c.fall-hold .cl-facade{transform-origin:800px 639px;animation:bkWob 2.4s .2s steps(29) both}
@keyframes bkWob{0%,100%{transform:none}12%{transform:rotate(2deg)}26%{transform:rotate(-1.6deg)}40%{transform:rotate(1.1deg)}54%{transform:rotate(-.7deg)}70%{transform:rotate(.3deg)}}
.cl-c.fall-hold .cw{animation:bkAround 1.2s 2.9s steps(9) both}
@keyframes bkAround{from{transform:scale(5.6)}to{transform:translateX(-1900px) scale(2.2)}}
.bk-back{transform:translateX(1700px)}
.cl-c.fall-hold .bk-back{animation:bkIn 1.2s 2.9s steps(9) both}
@keyframes bkIn{from{transform:translateX(1700px)}to{transform:none}}
/* gate transitions: push through the gate onto the tacked sheet; later the sheet tears off to reveal the classroom */
.gt-push .gtw{transform-origin:166px 646px;animation:gtPush .5s steps(4) both}@keyframes gtPush{to{transform:scale(5.4)}}
.gt-push .gt-reg{opacity:0;animation:clShowQ .01s .5s both}
.gt-tear{transform-origin:800px 0;animation:gtTear .4s .15s steps(4) both}@keyframes gtTear{to{transform:translateY(1000px) rotate(8deg)}}
@keyframes camPan{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}@keyframes bkTw{0%,85%{fill:#FFE7A6}86%,100%{fill:#B39A68}}
</style>

<div id="viewport" aria-label="Presentation stage. Press right arrow or space to advance, left arrow to go back.">
  <div id="stage"></div>
</div>
<div id="hint">Press → or space to begin<small>← back · H keys and position · M mute · F full screen</small></div>
<div id="hud" hidden></div>

<script>
"use strict";
/* ---------- tiny drawing helpers: every shape gets a paper-thickness underlayer ---------- */
const O = 6;
const R = (x,y,w,h,f,o=O,rx=0,extra="") => `<rect x="${x+o}" y="${y+o}" width="${w}" height="${h}" rx="${rx}" fill="var(--ul)"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${extra}/>`;
const P = (pts,f,o=O,extra="") => `<polygon points="${pts}" transform="translate(${o} ${o})" fill="var(--ul)"/><polygon points="${pts}" fill="${f}" ${extra}/>`;
const C = (cx,cy,r,f,o=O) => `<circle cx="${cx+o}" cy="${cy+o}" r="${r}" fill="var(--ul)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
const D = (d,f,o=O,extra="") => `<path d="${d}" transform="translate(${o} ${o})" fill="var(--ul)"/><path d="${d}" fill="${f}" ${extra}/>`;
const L = (x1,y1,x2,y2,c,w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const T = (x,y,s,cls,fill,txt,anchor="middle",extra="") => `<text x="${x}" y="${y}" font-size="${s}" class="${cls}" fill="${fill}" text-anchor="${anchor}" ${extra}>${txt}</text>`;
const fit = (txt,maxW,base,ratio=.6) => Math.min(base, Math.floor(maxW/(txt.length*ratio)));
const svg = (inner,cls="") => `<svg viewBox="0 0 1600 900" class="${cls}" aria-hidden="true">${inner}</svg>`;
const anim = (name,dur,fps=12,extra="") => `style="animation:${name} ${dur}s steps(${Math.round(dur*fps)}) infinite ${extra}"`;

/* a shadow hand: wrist above, fingertips at (x,y) pointing down, rotated by rot */
const hand = (x,y,rot=0,s=1,cls="hand") => `<g class="${cls}" transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" fill="var(--shade)">
  <rect x="-34" y="-520" width="68" height="420" rx="20"/><rect x="-48" y="-130" width="96" height="104" rx="34"/>
  <rect x="-46" y="-50" width="20" height="74" rx="10"/><rect x="-22" y="-50" width="20" height="82" rx="10"/>
  <rect x="2" y="-50" width="20" height="78" rx="10"/><rect x="26" y="-50" width="19" height="64" rx="10"/>
  <rect x="38" y="-110" width="20" height="64" rx="10" transform="rotate(-28 48 -110)"/></g>`;

/* an operator: a small, ordinary person in kraft card with one everyday prop. Behind them, on the backdrop,
   a giant shadow of the same figure (Baum's Great Head vs. the little man behind the screen). They flinch when the flat falls.
   arms: list of arms; each arm a list of poses [tx,ty,fromPct,toPct] (one pose = static) on a cycle of dur seconds */
let _op=0, SHADOWS=[];
const takeShadows=()=>{const t=SHADOWS.join(""); SHADOWS=[]; return t;};
/* a jointed paper puppet: card limbs pinned at hips, knees and shoulder, a neck, shoulders wider than the waist,
   a head in profile with a nose and hair. Faces +x in local units; feet at 0, about 330 tall. */
function puppet(f, garment, hair, headStyle="", pins=true){
  const g=garment||f, h=hair||f;
  const pin=(x,y)=>pins?`<circle cx="${x}" cy="${y}" r="4.5" fill="#c99a3b"/><circle cx="${x-1.2}" cy="${y-1.2}" r="1.8" fill="#e6c46e"/>`:"";
  return `<rect x="-15" y="-152" width="18" height="76" rx="7" fill="${f}"/><rect x="-16" y="-82" width="16" height="74" rx="6" fill="${f}"/><rect x="-18" y="-11" width="28" height="11" rx="4" fill="${f}"/>
   <g transform="rotate(7 11 -150)"><rect x="2" y="-152" width="18" height="76" rx="7" fill="${f}"/><rect x="3" y="-82" width="16" height="74" rx="6" fill="${f}"/><rect x="3" y="-11" width="31" height="11" rx="4" fill="${f}"/>${pin(11,-80)}</g>
   ${pin(-6,-80)}
   <g transform="rotate(6 0 -150)">
     <g transform="rotate(10 -13 -250)"><rect x="-20" y="-254" width="14" height="66" rx="6" fill="${g}"/></g>
     <g transform="rotate(-3 -16 -190)"><rect x="-24" y="-194" width="13" height="62" rx="6" fill="${f}"/></g>
     <path d="M-24 -258 Q6 -270 36 -258 L27 -146 L-17 -146 Z" fill="${g}"/>${pin(-6,-148)}${pin(11,-148)}${pin(-13,-248)}
     <rect x="6" y="-278" width="12" height="22" fill="${f}"/>
     <g style="${headStyle}"><circle cx="14" cy="-298" r="24" fill="${f}"/><polygon points="35,-303 47,-292 35,-287" fill="${f}"/>
       <path d="M-11 -296 Q-10 -326 16 -324 Q36 -322 38 -308 Q20 -314 5 -309 Q-3 -302 -8 -286 Z" fill="${h}"/></g>
   </g>`;
}
function figure(f){ return puppet(f,f,f,"",false); }
const PROPS={
  cup:`<polygon points="-46,-146 -22,-146 -26,-112 -42,-112" fill="#F3EBD8"/><rect x="-47" y="-150" width="26" height="6" fill="#E6DCC4"/>`,
  lanyard:`<polyline points="-6,-266 9,-212 24,-266" fill="none" stroke="#4A7FC1" stroke-width="4"/><rect x="0" y="-214" width="20" height="24" rx="2" fill="#F3EBD8"/>`,
  phone:`<rect x="-50" y="-158" width="18" height="30" rx="3" fill="#2E3440"/><rect x="-47" y="-154" width="12" height="20" fill="#7FB8C9"/>`,
  clipboard:`<rect x="-52" y="-160" width="34" height="44" rx="3" fill="var(--kraftD)"/><rect x="-48" y="-152" width="26" height="32" fill="#F3EBD8"/><rect x="-41" y="-164" width="12" height="8" fill="var(--brass)"/>`,
};
const liveArm=p=>`<polyline id="${p}U" fill="none" stroke="var(--ul)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><polyline id="${p}" fill="none" stroke="var(--kraft)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle id="${p}F" r="7" fill="var(--kraft)"/>`;
function armTo(p,sx,sy,gx,gy){
  const a=document.getElementById(p); if(!a) return;
  const vx=gx-sx, vy=gy-sy, len=Math.hypot(vx,vy)||1;
  let nx=-vy/len, ny=vx/len; if(ny<0){nx=-nx;ny=-ny;}
  const ex=sx+vx/2+nx*len*.16, ey=sy+vy/2+ny*len*.16;
  a.setAttribute("points",`${sx},${sy} ${ex},${ey} ${gx},${gy}`);
  document.getElementById(p+"U").setAttribute("points",`${sx+4},${sy+4} ${ex+4},${ey+4} ${gx+4},${gy+4}`);
  const f=document.getElementById(p+"F"); f.setAttribute("cx",gx); f.setAttribute("cy",gy);
}
function person(x,fy,s,dir,arms,o={}){
  const GAR={lanyard:"#5E6B7A",clipboard:"#E8E2D2",phone:"#4C6E70",cup:"#8A6A5A"};
  const {dur=2,cls="hand",glance=4.7,props=[],shadow=true,fd=null,extra="",k=2.8,garment=GAR[props[0]]||"#6B7A86",hair="#3A2E22"}=o;
  const id="op"+(_op++), c="var(--kraft)";
  const sx=x+dir*20*s, sy=fy-253*s;
  let css=`@keyframes ${id}h{0%,76%{transform:none}79%,91%{transform:translate(-16px,4px)}94%,100%{transform:none}}`;
  let armSvg="";
  arms.forEach((poses,ai)=>{
    poses.forEach((pp,pi)=>{
      const [tx,ty,a=0,b=100]=pp;
      const vx=tx-sx, vy=ty-sy, len=Math.hypot(vx,vy)||1;
      let nx=-vy/len, ny=vx/len; if(ny<0){nx=-nx;ny=-ny;}
      const ex=sx+vx/2+nx*len*.16, ey=sy+vy/2+ny*len*.16;
      const line=`<polyline points="${sx+4},${sy+4} ${ex+4},${ey+4} ${tx+4},${ty+4}" fill="none" stroke="var(--ul)" stroke-width="${16*s}" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${sx},${sy} ${ex},${ey} ${tx},${ty}" fill="none" stroke="${c}" stroke-width="${16*s}" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${tx}" cy="${ty}" r="${11*s}" fill="${c}"/>`;
      if(poses.length===1){ armSvg+=line; return; }
      const k=`${id}a${ai}p${pi}`;
      css+= a===0 ? `@keyframes ${k}{0%{opacity:1}${b}%{opacity:0}100%{opacity:0}}` : `@keyframes ${k}{0%{opacity:0}${a}%{opacity:1}${b}%{opacity:${b>=100?1:0}}100%{opacity:${b>=100?1:0}}}`;
      armSvg+=`<g style="animation:${k} ${dur}s steps(1) infinite">${line}</g>`;
    });
  });
  if(shadow){
    // the operator's own shadow: cast from the feet, away from the key light at top centre, k times larger, same pose
    const skew=-Math.max(-16,Math.min(16,(x-800)/28));
    SHADOWS.push(`<g class="${cls}"><use href="#${id}w" transform="translate(${x} ${fy}) skewX(${skew.toFixed(1)}) scale(${k}) translate(${-x} ${-fy})" style="filter:brightness(0);opacity:.5"/></g>`);
  }
  return `<g class="${cls}"><style>${css}</style><g id="${id}w"><g class="op" ${fd?`style="--fd:${fd}s"`:""}>
   <g transform="translate(${x+4} ${fy+4}) scale(${dir*s} ${s})">${figure("var(--ul)")}</g>
   <g transform="translate(${x} ${fy}) scale(${dir*s} ${s})">${puppet(c, garment, hair, `animation:${id}h ${glance}s steps(${Math.round(glance*12)}) infinite`)}
    ${props.map(p=>PROPS[p]).join("")}
   </g>${armSvg}${extra}</g></g></g>`;
}

/* ---------- the five stops ---------- */
const STOPS = [
  {id:"classroom", name:"Classroom", q:["Who sets","the threshold?"], fall:"fwd", obj:"scale", sound:"keaton"},
  {id:"cafeteria", name:"Cafeteria", q:["Who benefits","if you're worried?"], fall:"peel", obj:"treadmill", sound:"peel"},
  {id:"dorm", name:"Dorm", q:["What are you","paying with?"], fall:"fly", obj:"assembler", sound:"fly"},
  {id:"library", name:"Library", q:["Better at what?","For whom?"], fall:"book", obj:"bird", sound:"fold"},
  {id:"bookstore", name:"Bookstore", q:null, fall:"hold", obj:"anamorph", sound:"hold"},
];

/* ---------- toys and machines ---------- */
function objScale(){
  // the detector is the live Anatomy figure (see mountDetector); a well-meaning administrator on a stepladder holds the threshold handle
  return `<g class="hand">${L(1108,780,1132,416,"var(--kraftD)",9)}${L(1198,780,1174,416,"var(--kraftD)",9)}
     ${[520,620,720].map(y=>L(1108+(780-y)*.066, y, 1198-(780-y)*.066, y,"var(--kraftD)",6)).join("")}${R(1120,408,66,12,"var(--kraft)",3)}</g>
   <svg id="detMount" x="450" y="190" width="660" height="710" viewBox="0 0 660 710" overflow="visible" style="width:660px;height:710px;display:inline"></svg>
   ${person(1150,410,.62,-1,[],{props:["lanyard"],k:1.7,extra:liveArm("detArm")})}`;
}
function detArm(g){ armTo("detArm",1150-20*.62,410-253*.62,450+g[0],190+g[1]); }
function objTreadmill(){
  // the treadmill toy (see mountTreadmill), crank pivot at stage (1070,738); a vendor turns it
  return `<svg id="tmMount" x="470" y="150" width="660" height="710" viewBox="0 0 660 710" overflow="visible" style="width:660px;height:710px;display:inline"></svg>
   ${person(1180,860,.62,-1,[],{props:["clipboard"],extra:liveArm("tmArm")})}`;
}
function tmArm(g){ armTo("tmArm",1180-20*.62,860-253*.62,470+g[0],150+g[1]); }
function objAssembler(){
  // the assembler is the live Anatomy figure (see mountAuction), scaled to .82 and raised so the hopper, lectern and crank clear the curtains
  return `<svg id="aucMount" x="500" y="110" width="660" height="710" viewBox="0 0 660 710" overflow="visible" style="width:660px;height:710px;display:inline"></svg>
   ${person(420,860,.62,1,[],{props:["phone"],extra:liveArm("aucArm")})}`;
}
function aucArm(g){ armTo("aucArm",420+20*.62,860-253*.62,500+g[0],110+g[1]); }
function objBird(){
  // the bird is the live Anatomy figure (see mountBird); its ladle pivots at stage (601,358); the operator grips the handle
  return `<svg id="birdMount" x="470" y="190" width="660" height="710" viewBox="0 0 660 710" overflow="visible" style="width:660px;height:710px;display:inline"></svg>
   <g class="hand">${R(318,457,150,323,"var(--kraft)")}<rect x="430" y="398" width="34" height="56" fill="rgba(207,227,234,.25)" stroke="#E8F1F4" stroke-width="3"/>
     ${C(447,442,9,"var(--brass)",0)}${C(441,428,9,"var(--brass)",0)}${C(453,416,9,"var(--brass)",0)}</g>
   ${person(388,457,.62,1,[],{props:["cup"],k:2.2,extra:liveArm("ladleArm")})}`;
}
function ladleArm(theta){ const t=theta*Math.PI/180; armTo("ladleArm",388+20*.62,457-253*.62,601-150*Math.cos(t),358-150*Math.sin(t)); }

const ANA=[
    [[650,300,300,220],[750,330,100,110],[560,260,90,60,-30],"#9AA4B2"],
    [[690,360,60,50],[790,580,24,24],[1000,240,40,40,40],"#E0B33C"],
    [[850,360,60,50],[790,620,24,24],[580,700,40,40,-25],"#E0B33C"],
    [[785,240,30,60],[796,450,8,40],[1040,520,24,70,60],"#9AA4B2"],
    [[720,460,160,30],[780,450,40,10],[520,470,120,24,20],"#5E6876"],
    [[560,560,480,80],[640,470,320,90],[900,780,300,60,-12],"#7C8796"],

function mountRobot(){
  const bot=document.getElementById("stRobot"); if(!bot) return;
  const spokes=[...bot.querySelectorAll("[data-spoke]")];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  let st="wait",n=Math.round(rnd(10,60)),x=-40,dir=1,v=1.2,stopAt=null,last=-1,k=0; const t0=performance.now();
  const draw=()=>{bot.setAttribute("transform",`translate(${x.toFixed(1)} 180) scale(${dir} 1)`); spokes.forEach((s,i)=>s.setAttribute("transform",`rotate(${(k*45+i*30)%180} ${s.x.baseVal.value+.3} 6.4)`));};
  const step=()=>{ if(stage.classList.contains("frozen")) return;
    if(st==="wait"){ if(--n<=0){ dir=Math.random()<.5?1:-1; x=dir>0?-30:410; v=rnd(.9,1.8); stopAt=Math.random()<.45?rnd(60,320):null; st="go"; } draw(); return; }
    if(st==="pause"){ if(--n<=0){ if(Math.random()<.25) dir=-dir; st="go"; } draw(); return; }
    k++; x+=dir*v;
    if(stopAt!==null && Math.abs(x-stopAt)<v){ st="pause"; n=Math.round(rnd(10,40)); stopAt=null; }
    if(x<-40||x>420){ st="wait"; n=Math.round(rnd(30,110)); }
    draw(); };
  const tick=now=>{const F=Math.floor((now-t0)/1000*12); if(F!==last){last=F;step();} if(bot.isConnected) requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
}

/* backstage light: a fire-effect lantern. A long slotted drum with a roll of yellow gel inside, lit along its length and
   turning slowly, hung lengthwise along the back wall behind a low groundrow. It turns on its long axis, so each cut-out's
   patch climbs the wall: a hole at angle phi above level lands at height A*tan(phi), stretched 1/cos^2 as it rises and
   dimming as cos^3, then gives out near the top. Holes facing down throw onto the floor behind the groundrow. */
const FIRE_Y=600, FIRE_X0=200, FIRE_X1=1400;
function fireDrum(){
  const id="fd"+(_op++);
  let top=`M${FIRE_X0} 620 V568`; let seed=41; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let x=FIRE_X0;x<FIRE_X1;){ const w=Math.min(FIRE_X1-x,40+rnd()*50); top+=` q${(w/2).toFixed(0)} ${(-8-rnd()*8).toFixed(0)} ${w.toFixed(0)} 0`; x+=w; }
  const edge=top.replace(`M${FIRE_X0} 620 V568`,`M${FIRE_X0} 568`);
  return `<defs><filter id="${id}b" filterUnits="userSpaceOnUse" x="-700" y="-400" width="3000" height="1100"><feGaussianBlur stdDeviation="7"/></filter>
     <clipPath id="${id}c"><rect x="-500" y="-500" width="2600" height="1120"/></clipPath>
     <linearGradient id="${id}g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B8442A" stop-opacity=".6"/><stop offset="1" stop-color="#B8442A" stop-opacity="0"/></linearGradient></defs>
   <g clip-path="url(#${id}c)" style="mix-blend-mode:screen"><rect class="fireAmb" x="${FIRE_X0-60}" y="380" width="${FIRE_X1-FIRE_X0+120}" height="240" rx="120" fill="url(#${id}g)" opacity=".5"/>
     <g class="fireLight" filter="url(#${id}b)"></g></g>
   <path d="${top} V620Z" fill="#000" opacity=".3" transform="translate(6 6)"/><path d="${top} V620Z" fill="#3A3026"/>
   <path class="fireRim" d="${edge}" fill="none" stroke="#D0623A" stroke-width="3" opacity=".6"/>
   ${[360,800,1240].map(x=>L(x,590,x+16,620,"#2A231C",5)).join("")}`;
}
function mountFire(g){
  const NS="http://www.w3.org/2000/svg", amb=g.parentNode.querySelector(".fireAmb"), rim=g.closest("svg").querySelector(".fireRim");
  let seed=23; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  /* the cut-outs: long tapering slits that wander along the drum's length, like wood grain */
  const holes=[...Array(84)].map((_,i)=>{ const N=24, f1=.4+rnd()*.8, f2=1.2+rnd()*1.5, p1=rnd()*6.28, p2=rnd()*6.28, k=.4+rnd()*.5, top=[], bot=[];
    const flip=k>.65?1:-1, bend=(p1<3.14?1:-1)*(.25+.25*k); for(let j=0;j<=N;j++){ const x=-1+2*j/N, t=(flip*x+1)/2, w=Math.sqrt(Math.max(0,1-x*x))*(.34+.66*Math.pow(t,.9))*1.25, c=bend*(x*x-.35)+.06*Math.sin(f2*x*Math.PI+p2);
      top.push([x,c-w]); bot.push([x,c+w]); }
    const pts=top.concat(bot.reverse()); let d=`M${pts[0][0].toFixed(3)} ${pts[0][1].toFixed(3)}`;
    for(let j=1;j<pts.length;j++){ const p=pts[j-1], q=pts[j]; d+=` Q${p[0].toFixed(3)} ${p[1].toFixed(3)} ${((p[0]+q[0])/2).toFixed(3)} ${((p[1]+q[1])/2).toFixed(3)}`; }
    const e=document.createElementNS(NS,"path"); e.setAttribute("d",d+"Z"); e.setAttribute("fill",["#C9502C","#A8321F","#D86A34"][i%3]); g.appendChild(e);
    return {e, phi:rnd()*2*Math.PI, x:FIRE_X0+60+rnd()*(FIRE_X1-FIRE_X0-120), len:45+rnd()*75, s:20+rnd()*14}; });
  const A=170, W=2*Math.PI/12; let last=-1; const t0=performance.now();
  const render=F=>{ const t=F/12; let sum=0;
    holes.forEach(h=>{ const ph=((h.phi+W*t)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI/2, c=Math.cos(ph);
      if(ph>1.32||c<.25){ h.e.style.display="none"; return; }
      const y=FIRE_Y-A*Math.tan(ph), a=Math.min(1,.72*c*c*c); if(y<566) sum+=a;
      h.e.style.display=""; h.e.setAttribute("opacity",a.toFixed(3));
      h.e.setAttribute("transform",`translate(${h.x.toFixed(1)} ${y.toFixed(1)}) scale(${(h.len*(1+.08*(1/c-1))).toFixed(2)} ${(h.s/(c*c)).toFixed(2)})`); });
    if(amb) amb.setAttribute("opacity",Math.min(1,.4+.015*sum).toFixed(3)); if(rim) rim.setAttribute("opacity",Math.min(1,.35+.02*sum).toFixed(3)); };
  const tick=now=>{const F=Math.floor((now-t0)/1000*12); if(F!==last){last=F;render(F);} if(g.isConnected) requestAnimationFrame(tick);};
  render(0); requestAnimationFrame(tick);
}

/* the anamorph seen from behind: the same pieces on the same cycle, mirrored, each hanging on its wire from the flies */
function mountBackFrags(g){
  const NS="http://www.w3.org/2000/svg";
  const KEYS=[[0,2],[8,2],[22,0],[40,0],[50,2],[58,2],[72,1],[90,1],[100,2]];
  const items=ANA.map(f=>{ const wire=document.createElementNS(NS,"line"); wire.setAttribute("stroke","rgba(220,210,190,.45)"); wire.setAttribute("stroke-width","2"); g.appendChild(wire);
    const p=document.createElementNS(NS,"g"); p.innerHTML=`<rect x="6" y="6" width="1" height="1" fill="var(--ul)"/><rect width="1" height="1" fill="${f[3]}"/>`; g.appendChild(p); return {f,wire,p,ul:p.firstChild,fr:p.lastChild}; });
  const lay=(f,pct)=>{ let i=0; while(i<KEYS.length-2 && pct>=KEYS[i+1][0]) i++; const [a,la]=KEYS[i],[b,lb]=KEYS[i+1], t=b>a?Math.min(1,Math.max(0,(pct-a)/(b-a))):0;
    const A=f[la],B=f[lb]; return [0,1,2,3,4].map(k=>(A[k]||0)+((B[k]||0)-(A[k]||0))*t); };
  let last=-1; const t0=performance.now();
  const render=F=>{ const pct=(F%108)/108*100;
    items.forEach(it=>{ const [x,y,w,h,r]=lay(it.f,pct), mx=1600-x-w;
      it.p.setAttribute("transform",`translate(${mx.toFixed(1)} ${y.toFixed(1)}) rotate(${(-r).toFixed(1)} ${w/2} 0)`);
      for(const e of [it.ul,it.fr]){ e.setAttribute("width",w.toFixed(1)); e.setAttribute("height",h.toFixed(1)); }
      it.wire.setAttribute("x1",(mx+w/2).toFixed(1)); it.wire.setAttribute("x2",(mx+w/2).toFixed(1)); it.wire.setAttribute("y1","-10"); it.wire.setAttribute("y2",y.toFixed(1)); }); };
  const tick=now=>{const F=Math.floor((now-t0)/1000*12); if(F!==last){last=F;render(F);} if(g.isConnected) requestAnimationFrame(tick);};
  render(0); requestAnimationFrame(tick);
}

/* the bird on a wire: waits, flies in from the left, lands on the bench at a random spot, flies back off */
function mountClassBird(){
  const bird=document.getElementById("clBird"), wire=document.getElementById("clWire"); if(!bird) return;
  const wings=[...bird.querySelectorAll("[data-w]")], pose=p=>wings.forEach(w=>w.style.display=w.dataset.w===p?"":"none");
  const rnd=(a,b)=>a+Math.random()*(b-a);
  let st="wait",n=Math.round(rnd(12,36)),x=-30,y=140,tx=0,ty=162,sx=0,sy=0,steps=0,k=0,last=-1,peck=0;const t0=performance.now();
  const draw=flip=>{bird.setAttribute("transform",`translate(${x.toFixed(1)} ${(y+peck).toFixed(1)}) scale(${flip?-1:1} 1)`);wire.setAttribute("x1",x.toFixed(1));wire.setAttribute("y1",(y-5).toFixed(1));wire.setAttribute("x2",(x+6).toFixed(1));};
  const step=()=>{ if(stage.classList.contains("frozen")) return; k++;
    if(st==="wait"){x=-30;draw(false);if(--n<=0){st="in";sx=-20;sy=rnd(110,140);tx=rnd(32,70);steps=Math.round(rnd(22,34));n=0;}return;}
    if(st==="in"){n++;const t=n/steps;x=sx+(tx-sx)*t;y=sy+(ty-sy)*t-Math.sin(t*Math.PI)*14;pose(k%2?"up":"dn");draw(false);if(n>=steps){st="sit";n=Math.round(rnd(18,48));x=tx;y=ty;pose("fold");}return;}
    if(st==="sit"){peck=Math.random()<.15?1.5:0;draw(Math.random()<.04);if(--n<=0){peck=0;st="out";sx=x;sy=y;steps=Math.round(rnd(14,22));n=0;}return;}
    if(st==="out"){n++;const t=n/steps;x=sx+(-40-sx)*t;y=sy-t*rnd(30,44);pose(k%2?"up":"dn");draw(true);if(n>=steps){st="wait";n=Math.round(rnd(24,72));}}};
  const tick=now=>{const F=Math.floor((now-t0)/1000*12);if(F!==last){last=F;step();} if(bird.isConnected) requestAnimationFrame(tick);};
  pose("up"); requestAnimationFrame(tick);
}

// ===== Backlot foley: synthesized stagecraft sounds (pure Web Audio, no samples) =====
// Drop-in: defines ac, muted, audio(), SOUND{bell,tick,steps,steps2,keaton,peel,fly,fold,hold,finale}.
let ac=null, muted=false;
const MASTER=0.7;   // overall level into the compressor (tweak first)
const VERB=0.12;    // default reverb send per sound (0 = dry, ~0.4 = distant)
const SPEECH_DIP=-5; // dB cut around 2.6 kHz on the whole bus, to leave room for the voice
let BUS=null, ROOM=null; const NZ={};

function audio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } buildEngine(); }
  if(ac.state==="suspended") ac.resume();
  return ac;
}

function buildEngine(){
  const sr=ac.sampleRate, R=Math.random;
  // cached 2 s noise buffers, normalised
  const mk=gen=>{ const b=ac.createBuffer(1,sr*2,sr), d=b.getChannelData(0); let m=0;
    for(let i=0;i<d.length;i++){ d[i]=gen(); m=Math.max(m,Math.abs(d[i])); }
    for(let i=0;i<d.length;i++) d[i]*=.9/m; return b; };
  NZ.white=mk(()=>R()*2-1);
  let b0=0,b1=0,b2=0; NZ.pink=mk(()=>{ const w=R()*2-1; b0=.99765*b0+w*.099; b1=.963*b1+w*.2965; b2=.57*b2+w*1.0527; return b0+b1+b2+w*.1848; });
  let br=0; NZ.brown=mk(()=>(br=(br+.02*(R()*2-1))/1.02));
  // master bus: gain -> HPF (laptops/earbuds/Zoom reproduce little below ~100 Hz) -> speech-pocket dip -> gentle compressor
  BUS=ac.createGain(); BUS.gain.value=MASTER;
  const hp=filt("highpass",90,.7), dip=filt("peaking",2600,.7); dip.gain.value=SPEECH_DIP;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.25;
  BUS.connect(hp).connect(dip).connect(comp).connect(ac.destination);
  // room: small wooden stage, ~0.9 s, tail darkens over time, a few early reflections
  const len=sr*.9|0, ir=ac.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); let y=0;
    for(let i=0;i<len;i++){ const x=i/len; y+=((R()*2-1)-y)*(.5-.45*x); d[i]=i<sr*.006?0:y*Math.exp(-i/(sr*.13)); }
    for(let k=0;k<6;k++) d[(sr*(.006+R()*.03))|0]+=(R()-.5)*.6; }
  ROOM=ac.createConvolver(); ROOM.buffer=ir; ROOM.connect(BUS);
}

// ---------- small helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
function filt(type,f,q=.7){ const b=ac.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q; return b; }
function nsrc(type){ const s=ac.createBufferSource(); s.buffer=NZ[type]; s.loop=true; return s; }
// route to bus (panned) + reverb send; returns nodes for cleanup
function out(node,pan=0,wet=VERB){ const p=ac.createStereoPanner(), w=ac.createGain(); p.pan.value=pan; w.gain.value=wet;
  node.connect(p).connect(BUS); p.connect(w).connect(ROOM); return [p,w]; }
const cleanup=(src,nodes)=>{ src.onended=()=>nodes.forEach(n=>n.disconnect()); };

// filtered noise burst: linear attack a, exponential decay; optional filter sweep to f2
function burst(t,dur,{type="pink",ft="bandpass",f=800,f2,q=.8,g=.2,a=.004,pan=0,wet=VERB}={}){
  const s=nsrc(type), b=filt(ft,f,q), v=ac.createGain(); v.gain.value=0;
  v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+a); v.gain.setTargetAtTime(0,t+a,Math.max(.004,(dur-a)/3));
  if(f2){ b.frequency.setValueAtTime(f,t); b.frequency.exponentialRampToValueAtTime(f2,t+dur); }
  s.connect(b).connect(v); cleanup(s,[s,b,v,...out(v,pan,wet)]);
  s.start(t,rnd(0,1.9)); s.stop(t+dur*1.6+.05);
}
// noise whose gain follows a 1 kHz-resolution curve (grains, flutter, rasps)
function shaped(t,c,{type="white",ft="bandpass",f=3000,q=.8,pan=0,wet=VERB}={}){
  const dur=c.length/1000, s=nsrc(type), b=filt(ft,f,q), v=ac.createGain(); v.gain.value=0;
  c[0]=c[c.length-1]=0; v.gain.setValueCurveAtTime(c,t,dur);
  s.connect(b).connect(v); cleanup(s,[s,b,v,...out(v,pan,wet)]);
  s.start(t,rnd(0,1.9)); s.stop(t+dur+.05);
}
function curve(dur,fn){ const N=Math.ceil(dur*1000), c=new Float32Array(N); for(let i=0;i<N;i++) c[i]=fn(i/(N-1)); return c; }
// random grain train: dens grains/s, each decaying over dk ms, level g, density/level shaped by shape(x)
function grains(dur,dens,dk,g,shape=()=>1){ const N=Math.ceil(dur*1000), c=new Float32Array(N);
  for(let k=0;k<dens*dur;k++){ const p=Math.random()*N|0, a=g*Math.random()**1.5*shape(p/N);
    for(let j=0;j<dk*5&&p+j<N;j++) c[p+j]+=a*Math.exp(-j/dk); }
  for(let i=0;i<N;i++) c[i]=Math.min(c[i],g*1.5); return c; }

// modal knock: a few inharmonic decaying sines (higher modes die faster) + contact tick
const WOOD=[1,2.32,4.25,6.63], BRASS=[1,2.76,5.4,8.93];
function knock(t,f,g,{decay=.06,modes=WOOD,pan=0,wet=VERB,tick=.3}={}){
  const m=ac.createGain(), nodes=[m,...out(m,pan,wet)];
  modes.forEach((r,i)=>{ const s=ac.createOscillator(), v=ac.createGain(), d=decay/(1+i*.8);
    s.frequency.value=f*r*rnd(.98,1.02); v.gain.value=0;
    v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g/(1+i*1.3),t+.002); v.gain.setTargetAtTime(0,t+.002,d);
    s.connect(v).connect(m); nodes.push(s,v); if(i===0) cleanup(s,nodes);
    s.start(t); s.stop(t+.002+d*9); });
  if(tick) burst(t,.012,{type:"white",f:Math.min(f*6,5000),q:1.2,g:g*tick,pan,wet});
}
// creak: stick-slip pulse train (sawtooth) through two wood resonances; rate & amplitude random-walk, with gaps
function creak(t,dur,rate,fc,g,{pan=0,wet=VERB,rise=0,shape=x=>Math.sin(Math.PI*x)}={}){
  const N=Math.max(8,Math.ceil(dur*200)), fr=new Float32Array(N), am=new Float32Array(N); let r=1,a=.7;
  for(let i=0;i<N;i++){ const x=i/(N-1);
    r=Math.min(1.4,Math.max(.7,r+rnd(-.08,.08))); a=Math.min(1,Math.max(0,a+rnd(-.25,.25)));
    fr[i]=rate*r*(1+rise*x); am[i]=a>.2?g*a*shape(x):0; }
  am[0]=am[N-1]=0;
  const o=ac.createOscillator(), b1=filt("bandpass",fc,6), b2=filt("bandpass",fc*2.1,8), h=ac.createGain(), v=ac.createGain();
  o.type="sawtooth"; o.frequency.value=fr[0]; o.frequency.setValueCurveAtTime(fr,t,dur); h.gain.value=.5; v.gain.value=0;
  v.gain.setValueCurveAtTime(am,t,dur);
  o.connect(b1).connect(v); o.connect(b2).connect(h).connect(v); cleanup(o,[o,b1,b2,h,v,...out(v,pan,wet)]);
  o.start(t); o.stop(t+dur+.02);
}
// handbell: partials [ratio, level, decay s], each a slightly detuned pair (slow warm beating), soft mallet
const HB=[[1,1,2.8],[2,.12,1.5],[3,.3,1.1],[4.2,.07,.5],[5.4,.04,.3]];
function bell(t,f,g,{pan=0,wet=.35,tone=2400}={}){
  const lp=filt("lowpass",tone,.5), nodes=[lp,...out(lp,pan,wet)];
  HB.forEach(([r,l,d],i)=>[-1,1].forEach(sg=>{ const s=ac.createOscillator(), v=ac.createGain();
    s.frequency.value=f*r+sg*rnd(.2,.7); v.gain.value=0;
    v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g*l/2,t+.005); v.gain.setTargetAtTime(0,t+.005,d/3);
    s.connect(v).connect(lp); nodes.push(s,v); if(i===0&&sg>0) cleanup(s,nodes);
    s.start(t); s.stop(t+d*2.7+.05); }));
  burst(t,.01,{type:"white",f:1800,q:1.5,g:g*.12,pan,wet});
}
// STEP_WET = room on each step; STEP_ECHO = slapback off the backlot walls (delay s, level)
const STEP_WET=.06, STEP_ECHO=[], STEP_LEVEL=6;
// footstep, old-time-radio style: a foley artist's hard shoes on a hollow wooden walking board.
// A heel "tok" (noise through a resonant wooden band, so it has a hollow color without a cartoon pitch),
// then a lighter toe "tik". Three takes to choose from:
//   A board  - hollow, mid wood, the classic walking board
//   B crisp  - leather heel on a hard floor, brighter and snappier
//   C heavy  - a slower, weightier shoe, a little scuff on the toe
const STEP_STYLES={
  A:{heel:[620,4,.034,.5], click:[1900,.04], toe:[1050,3.5,.02,.2], gap:[.085,.1], scuff:0},
  B:{heel:[880,3,.024,.42], click:[2400,.09], toe:[1350,3,.016,.18], gap:[.065,.08], scuff:0},
  C:{heel:[480,5,.045,.95], click:[1600,.05], toe:[820,4,.026,.32], gap:[.1,.125], scuff:.04},
};
let STEP_STYLE="C";
function step(t,g=1,pan=0,wet=STEP_WET,echo=true){ const S=STEP_STYLES[STEP_STYLE], v=g*rnd(.85,1.1)*STEP_LEVEL, j=rnd(.94,1.06);
  if(echo) STEP_ECHO.forEach(([dt,e])=>step(t+dt,g*e,-pan*.6,wet,false));
  const [hf,hq,hd,hg]=S.heel, [cf,cg]=S.click, [tf,tq,td,tg]=S.toe;
  burst(t,hd,{type:"pink",f:hf*j,q:hq,g:hg*v,a:.0008,pan,wet});            // heel tok
  burst(t,.008,{type:"white",f:cf*j,q:1,g:cg*v,a:.0005,pan,wet});          // contact click
  const toe=t+rnd(...S.gap);
  burst(toe,td,{type:"pink",f:tf*j,q:tq,g:tg*v,a:.0008,pan,wet});          // toe tik
  if(S.scuff) burst(toe+.005,.06,{type:"white",f:2600,f2:1700,q:.6,g:S.scuff*v,a:.008,pan,wet});
}
// big flat landing on the deck: low modal body + brown-noise thud + mid "whap" of trapped air
function slam(t,g=1,pan=0){
  knock(t,rnd(105,115),.5*g,{decay:.14,modes:[1,1.58,2.3,3.4],pan,wet:.22,tick:.1});
  knock(t,rnd(180,200),.28*g,{decay:.08,pan,wet:.22,tick:.1});
  burst(t,.3,{type:"brown",f:280,q:.5,g:1.1*g,pan,wet:.22});
  burst(t,.09,{f:750,q:.6,g:.3*g,pan,wet:.22});
}

// ---------- cues (t = start time) ----------
const SOUND={
  // distant handbell at the gate: rising fifth, open, unresolved
  bell:t=>{ bell(t,392,.22,{pan:-.1,wet:.45,tone:2200}); bell(t+.55,587.3,.15,{pan:.1,wet:.45,tone:2200}); },
  // pencil looping a row: 2-3 graphite strokes, different every time, plus the lead touching down
  tick:t=>{ const k=2+(Math.random()*2|0), d=rnd(.18,.32), hi=rnd(4200,5600);
    knock(t,rnd(800,1100),.08,{decay:.012,tick:.4,wet:.03});
    shaped(t,grains(d,rnd(900,1500),2.5,.35,x=>Math.sin(Math.PI*x*k)**2*(1-.4*x)),{f:hi,q:.7,pan:rnd(-.15,.15),wet:.03}); },
  // walk-in: four steps, same cadence as before, jittered
  steps:t=>{ [0,.48,.96,1.44].forEach((s,i)=>step(t+s+rnd(-.025,.025),i%2?.85:1,-.15+i*.1)); },
  // push-in: steps, brass thumb-latch, then the two doors creak open (~1.45 s)
  steps2:t=>{ [0,.45,.9].forEach((s,i)=>step(t+s+rnd(-.025,.025),(i%2?.85:1)*(1-i*.08),0));
    knock(t+1.3,rnd(1150,1300),.06,{decay:.025,modes:BRASS,tick:.5,wet:.1});
    knock(t+1.37,rnd(850,950),.04,{decay:.02,modes:BRASS,wet:.1});
    creak(t+1.45,.8,rnd(14,18),rnd(480,540),.5,{pan:-.4,rise:.4});
    creak(t+1.5,.75,rnd(17,21),rnd(580,640),.42,{pan:.4,rise:.3});
    burst(t+1.45,.7,{f:350,f2:600,q:.7,g:.06,a:.4,wet:.2});
    knock(t+2.2,rnd(130,150),.1,{decay:.05,wet:.2}); },
  // facade tips forward: brace gives (0.6), strain creak accelerates, air builds, flat slams (2.0), small bounce
  keaton:t=>{ knock(t+.6,rnd(360,400),.14,{decay:.03,tick:.4});
    creak(t+.62,1.15,rnd(7,9),rnd(420,480),.55,{rise:2.5,shape:x=>Math.sin(Math.PI*Math.min(1,x*1.15))});

    slam(t+2.0,.85);

    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);

    const pts = [[b[0] + nx, b[1] + ny], [b[0] - nx, b[1] - ny]];

      const t = Math.PI * i / 10, c = Math.cos(t), s = Math.sin(t);

    }

  };

  // A band of card along a polyline, half-width h, mitred at the bends.

    });

    8, 24, 42, 54,                // 7-10  swing down past the pour
    58, 58,                       // 11-12 scoop in the tray
    42,                           // 13    rise
    28, 28, 29, 28, 28, 28,       // 14-19 pour
    18, 6, 0,                     // 20-22 return
    -4, -4, -4, -4, -4, -4, -4,   // 23-29 rest
  ];
  const SPOUT = [-67.5, -93];
  const DRIP_FRAMES = [24, 25, 26];  // spout is over the gutter as the bird tops out
  const BLOB_SPEED = 30;             // px per frame along the gutter
  // Each drip lands on the gutter, runs down it, and drops into the tray.
  const DRIPS = DRIP_FRAMES.map(e => {
    const a = BIRD[e] * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const sx = PIVOT[0] + SPOUT[0] * c - SPOUT[1] * s, sy = PIVOT[1] + SPOUT[0] * s + SPOUT[1] * c;
    const s0 = (GUT[0][0] - sx) / (GUT[0][0] - GUT[1][0]) * GUT_LEN[0];
    const total = GUT_LEN[0] + GUT_LEN[1];
    const arriveAge = 1 + Math.ceil((total - s0) / BLOB_SPEED);

  const bodySegment = a => {
    const h = Math.min(160, 126 + Math.max(0, 10 - a) / 92 * 26), R = 32, cy = 140;

    if (c < 0) return BANDS.map(b => b.col);

      for (let k = 0; k < c; k++) cols[COLLAPSE[k]] = C.mud;
      const t = f >= 20 ? 1 : f === 19 ? 0.66 : f === 18 ? 0.33 : 0;

    } else {
      for (let i = 0; i < BANDS.length; i++) {
        const fromBottom = BANDS.length - 1 - i;
        if (f < 25 + fromBottom) cols[i] = C.mud;
      }
    }
    return cols;
  }

  function counterPos(c, f) {
    if (c < 0) return 0;
    const start = c < 5 ? 22 : 25;
    if (f < start) return c;
    return c + Math.min(1, (f - start + 1) / 3);
  }

    const c = Math.floor(F / CYCLE) % 7 - 1, f = F % CYCLE;

    // bird
    const a = BIRD[f];
    setAngle(bird, a);
    setAngle(ghost, a);
    tubeFluid.setAttribute('d', rect(-2.5, f2(tubeLevel(a)), 5, f2(126 - tubeLevel(a)), 2.5));
    bodyFluid.setAttribute('d', bodySegment(a));

    // ladle and its pour
    const l = LADLE[f];
    setAngle(ladle, l);
    if (onLadle) onLadle(l);
    const pouring = f >= 14 && f <= 19;
    mound.show(f === 12 || f === 13);
    stream.show(pouring);
    splash.forEach(s => s.show(pouring));
    if (pouring) {
      const [lx, ly] = toScreen(ladle, l, 134, 6);
      const x0 = lx + 1, y0 = ly + 2, ph = f * 1.7;
      const L = [], Rt = [];
      for (let y = y0, i = 0; y <= WATER + 2; y += 8, i++) {
        const w = 2.2 + 0.9 * Math.sin(ph + i * 1.3), sx = 1.2 * Math.sin(ph * 0.7 + i);
        L.push([x0 + sx - w, y]); Rt.unshift([x0 + sx + w, y]);
      }
      stream.set(poly([...L, ...Rt]));
      const k = f % 2 ? 1 : -1;
      splash[0].set(disc(x0 - 7 * k, WATER - 5 - (f % 3), 2.4));
      splash[1].set(disc(x0 + 9 * k, WATER - 9 + (f % 3), 1.8));
    }

    // spout drips -> gutter -> tray
    DRIPS.forEach((d, i) => {
      const age = (f - d.e + CYCLE) % CYCLE;
      drips[i].show(age === 0);
      if (age === 0) {
        const x = f2(d.sx), y = f2(d.sy + 6);
        drips[i].set(`M${x} ${f2(y - 5)}Q${f2(x + 3.4)} ${f2(y + 1)} ${x} ${f2(y + 3.2)}Q${f2(x - 3.4)} ${f2(y + 1)} ${x} ${f2(y - 5)}Z`);
      }
      const onGutter = age >= 1 && age < d.arriveAge;
      blobs[i].show(onGutter);
      if (onGutter) {
        const [x, y] = gutterAt(d.s0 + BLOB_SPEED * (age - 1));
        blobs[i].set(disc(f2(x), f2(y - 5.5), 3.4, 2.4));
      }

    // tray level: up with each arriving drip, down with each scoop
    const amount = DRIPS.filter(d => d.arriveFrame <= f).length - (f >= SCOOP_FRAME ? DRIPS.length : 0);
    const ty = TRAY_LOW - TRAY_STEP * amount;
    trayMud.setAttribute('d', rect(152, ty, 58, 334 - ty));
    traySurface.setAttribute('d', rect(152, ty, 58, 1.6));

    // glass bands
    const cols = bandColors(c, f);
    cols.forEach((col, i) => {
      bandEls[i].r.setAttribute('fill', col);
      const top = i === 0;
      const same = !top && cols[i - 1] === col;
      bandEls[i].edge.setAttribute('fill', top ? mix(col, '#ffffff', 0.35) : mix(col, '#000000', 0.3));
      bandEls[i].edge.style.display = same ? 'none' : '';
    });

    // counter
    const pos = counterPos(c, f);
    wheel.setAttribute('transform', `translate(0 ${f2(-pos * 26)})`);
    const clicking = pos !== Math.floor(pos) || (f === (c < 5 ? 24 : 27));
    setAngle(tab, clicking ? -28 : 0);
  }

  // ---------- stepped loop ----------
  let last = -1;
  const t0 = window.__machineT0 ?? performance.now();
  const tick = now => {
    const F = Math.floor((now - t0) / 1000 * FPS);
    if (F !== last) { last = F; render(F); }
    if (svg.isConnected) requestAnimationFrame(tick);
  };
  render(0); requestAnimationFrame(tick);
}

  const coins=[0,1,2].map(()=>{const g=el('g',{},coinL); part(g,disc(0,0,7),C.brass,C.brassEdge); el('path',{d:disc(-2,-2,2.4),fill:C.brassHi},g); return g;});
  const PER=30, arc=(a,b,s,h)=>[a[0]+(b[0]-a[0])*s, a[1]+(b[1]-a[1])*s-h*Math.sin(Math.PI*s)];

/* ---------- classroom machine: the height gate ("YOU MUST BE THIS HUMAN") ----------
   Each essay is a standing card whose HEIGHT is the detector's "how human" score; whole-card color says who wrote it.
   A brass bar on the post is the threshold. Cards that reach the bar pass to HUMAN; shorter cards are stamped AI and
   drop into the AI bin. The bins fill with visible stacks, so the pile is the tally. Twice per loop the administrator
   lowers the bar: one gold card is spared and one grey card slips through with it. */
function mountHeightGate(svg, onGrip){
  const NS='http://www.w3.org/2000/svg', OFF=[3,4], FPS=12, PER=36;
  const C={kraft:'#c9a273',kraftDk:'#b28a5b',kraftEdge:'#6f4f2c',flute:'#a47d4e',speck:'#9e7749',cream:'#f3ead2',creamEdge:'#a8946b',
    brass:'#c99a3b',brassEdge:'#6e5018',brassHi:'#e6c46e',brassDk:'#8f6a22',ink:'#2c2116',belt:'#3a2e22',red:'#C8463F',
    teal:'#2a9d8f',tealDk:'#1d6e64',gold:'#e0b13a',goldDk:'#a37f1f',grey:'#9aa0a6',greyDk:'#6c7177'};
  const KIND={t:[C.teal,C.tealDk],g:[C.gold,C.goldDk],r:[C.grey,C.greyDk]};
  /* 12 cards: kind, height. Cards 6 and 7 meet the lowered bar. */
  const CARDS=[['t',215],['g',150],['r',95],['t',230],['g',168],['r',110],['g',140],['r',130],['t',220],['g',142],['r',118],['t',208]];
  const BAR_UP=175, BAR_DN=118, BELT=470, GATE_X=262, CW=78, LOOP=CARDS.length*PER;
  const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
  const f2=v=>+v.toFixed(2);
  const rect=(x,y,w,h,r=0)=>r?`M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`:`M${x} ${y}H${x+w}V${y+h}H${x}Z`;
  const disc=(cx,cy,r)=>`M${cx-r} ${cy}A${r} ${r} 0 1 0 ${cx+r} ${cy}A${r} ${r} 0 1 0 ${cx-r} ${cy}Z`;
  const part=(p,d,fill,edge)=>{const u=el('path',{d,fill:edge,transform:`translate(${OFF[0]} ${OFF[1]})`},p);const f=el('path',{d,fill},p);return{u,f,set(d2){u.setAttribute('d',d2);f.setAttribute('d',d2);}};};
  const fastener=(p,x,y,r)=>{part(p,disc(x,y,r),C.brass,C.brassEdge);el('path',{d:disc(x+r*.18,y+r*.18,r*.62),fill:C.brassDk},p);el('path',{d:disc(x,y,r*.62),fill:C.brass},p);el('path',{d:disc(x-r*.3,y-r*.3,r*.3),fill:C.brassHi},p);};
  let seed=5; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const speckle=(p,x,y,w,h,n)=>{let d='';for(let i=0;i<n;i++)d+=disc(f2(x+rnd()*w),f2(y+rnd()*h),f2(.5+rnd()*.7));el('path',{d,fill:C.speck},p);};
  const lbl=(p,x,y,txt,size,fill,extra={})=>{const t=el('text',Object.assign({x,y,'text-anchor':'middle','font-family':'"Big Shoulders Stencil Display", Impact, sans-serif','font-size':size,'font-weight':800,fill,'letter-spacing':2},extra),p);t.textContent=txt;return t;};
  const root=el('g',{},svg);

  /* base bench */
  part(root,rect(60,662,40,12,2),C.kraftDk,C.kraftEdge); part(root,rect(560,662,40,12,2),C.kraftDk,C.kraftEdge);
  part(root,rect(30,640,600,22,2),C.kraft,C.kraftEdge); el('path',{d:rect(32,644,596,14),fill:C.flute},root);

  /* the stamp's post, behind the conveyor; its rod slides through a brass sleeve at the top */
  part(root,rect(92,392,16,248,3),C.kraftDk,C.kraftEdge); speckle(root,94,400,12,230,14);
  /* conveyor */
  part(root,rect(48,488,14,152,2),C.kraftDk,C.kraftEdge); part(root,rect(420,488,14,152,2),C.kraftDk,C.kraftEdge);
  part(root,rect(36,BELT,412,20,10),C.belt,'#1f1812');
  const cleatClip=el('clipPath',{id:'hgc'+Math.floor(rnd()*1e6)},svg); el('path',{d:rect(46,BELT,392,5)},cleatClip);
  const cleats=el('g',{'clip-path':`url(#${cleatClip.id})`},root); const cleatRow=el('g',{},cleats);
  for(let x=20;x<480;x+=28) el('path',{d:rect(x,BELT,12,5,1),fill:C.kraftDk},cleatRow);
  fastener(root,56,BELT+10,6); fastener(root,428,BELT+10,6);

  /* bins: open crates so the stacks show; big labels */
  const bin=(x,label)=>{ part(root,rect(x,520,160,8,2),C.kraftDk,C.kraftEdge); part(root,rect(x,528,10,112,2),C.kraft,C.kraftEdge); part(root,rect(x+150,528,10,112,2),C.kraft,C.kraftEdge);
  };
  bin(150,'AI'); bin(462,'HUMAN');
  const pileAI=el('g',{},root), pileHU=el('g',{},root);
  root.appendChild(pileAI); root.appendChild(pileHU);
  /* crate fronts drawn after piles so the label board sits in front */
  const front=el('g',{},root);
  for(const [x,label] of [[150,'AI'],[462,'HUMAN']]){ part(front,rect(x-6,600,172,40,3),C.kraft,C.kraftEdge); speckle(front,x-4,602,168,36,30); lbl(front,x+80,632,label,30,C.ink); fastener(front,x+4,606,3); fastener(front,x+156,606,3); }

  /* the post, the sign and the bar */
  part(root,rect(440,90,20,550,3),C.kraftDk,C.kraftEdge); speckle(root,442,100,16,520,40);
  const sign=el('g',{},root); part(sign,rect(250,96,184,124,6),C.cream,C.creamEdge); part(sign,rect(428,140,14,12,2),C.kraftDk,C.kraftEdge);
  lbl(sign,342,136,'YOU MUST',26,C.ink); lbl(sign,342,166,'BE THIS',26,C.ink); lbl(sign,342,204,'HUMAN',38,C.ink);
  fastener(sign,258,104,3); fastener(sign,426,104,3); fastener(sign,258,212,3); fastener(sign,426,212,3);
  const bar=el('g',{},root);
  part(bar,rect(250,-7,210,14,4),C.brass,C.brassEdge); el('path',{d:rect(254,-4,200,3),fill:C.brassHi},bar);
  part(bar,rect(446,-10,8,20,2),C.brassDk,C.brassEdge);
  const rod=el('g',{},root); part(rod,rect(447,-251,6,251,3),C.kraftDk,C.kraftEdge); part(rod,rect(447,-251,160,6,3),C.kraftDk,C.kraftEdge);
  part(rod,rect(583,-262,34,26,4),C.belt,'#1f1812'); for(let i=0;i<4;i++) el('path',{d:rect(587+i*8,-262,2,26),fill:'#5a4a3a'},rod); fastener(rod,450,-248,4);

  /* stamp arm and the moving card */
  /* the stamp hangs on an arm from a collar at the top of its post; the post turns 180 degrees to swing the stamp onto the card */
  const collar=el('g',{},root); part(collar,rect(86,BELT-76,28,28,4),C.brass,C.brassEdge); const collarStripe=el('path',{fill:C.brassEdge},collar); fastener(collar,100,BELT-54,3.5);
  const stampBack=el('g',{},root);
  const card=el('g',{},root); const cardFace=part(card,'',C.teal,C.tealDk); const lines=el('g',{},card); const stampMark=el('g',{},card);
  const stampFront=el('g',{},root);
  const arm=el('g',{}); const armBar=part(arm,'',C.kraft,C.kraftEdge); const head=part(arm,'',C.belt,'#1f1812'); const headPlate=part(arm,'',C.brassDk,C.brassEdge);

  const barY=G=>{ const i=Math.floor(G/PER), f=G%PER;
    const up=BELT-BAR_UP, dn=BELT-BAR_DN, ease=t=>t<=0?up:t>=1?dn:up+(dn-up)*t;
    if(i===5&&f>=26) return ease((f-25)/9); if(i===6||i===7) return dn; if(i===8&&f<12) return ease(1-(f+1)/12); return up; };
  const passes=(i,G)=>CARDS[i][1] >= BELT - barY(i*PER+18);
  const pile=(g,list,x)=>{ g.innerHTML=''; list.forEach((k,j)=>{ const [c,dk]=KIND[k]; part(g,rect(x+16,588-j*11,128,10,2),c,dk); if(g===pileAI) el('path',{d:rect(x+60,589-j*11,40,7,1),fill:'none',stroke:C.red,'stroke-width':2},g); }); };

  function render(F){
    const G=((F%LOOP)+LOOP)%LOOP, i=Math.floor(G/PER), f=G%PER, [k,h]=CARDS[i], [col,dk]=KIND[k];
    const by=barY(G);
    bar.setAttribute('transform',`translate(0 ${f2(by)})`); rod.setAttribute('transform',`translate(0 ${f2(by)})`);
    if(onGrip) onGrip([600, f2(by-249)]);
    cleatRow.setAttribute('transform',`translate(${(F*7)%28} 0)`);
    /* piles of everything already sorted this loop */
    const ai=[],hu=[]; for(let j=0;j<i;j++){ (passes(j)?hu:ai).push(CARDS[j][0]); }
    const pass=passes(i);
    if(f>=33) (pass?hu:ai).push(k);
    pile(pileAI,ai,150); pile(pileHU,hu,462);
    /* the current card */
    let x,y=BELT,rot=0,show=true;
    if(f<=15){ x=-90+(GATE_X+90)*(f/15); }
    else if(f<=21){ x=GATE_X; }
    else if(pass){ const t=Math.min(1,(f-21)/7); x=GATE_X+(500-GATE_X)*t; if(f>=28){ y=BELT+(f-27)*26; } if(f>=33) show=false; }
    else { x=GATE_X; if(f>=27){ const t=Math.min(1,(f-26)/6); x=GATE_X-60*t; y=BELT+120*t; rot=-80*t; } if(f>=33) show=false; }
    card.style.display=show?'':'none';
    card.setAttribute('transform',`translate(${f2(x)} ${f2(y)}) rotate(${rot})`);
    cardFace.set(rect(0,-h,CW,h,4)); cardFace.f.setAttribute('fill',col); cardFace.u.setAttribute('fill',dk);
    lines.innerHTML=''; for(let j=0;j<Math.floor((h-30)/16);j++) el('path',{d:rect(12,-h+18+j*16,CW-24-(j%3)*8,4,2),fill:C.cream,opacity:.75},lines);
    stampMark.innerHTML=''; if(!pass&&f>=23){ const cy=-62; el('path',{d:rect(8,cy-18,CW-16,36,3),fill:'none',stroke:C.red,'stroke-width':5},stampMark); lbl(stampMark,CW/2,cy+12,'AI',30,C.red); }
    /* the stamp swings in only for cards that fall short */
    /* the post turns: the arm swings 180 degrees through the front onto the card, presses, and swings back */
    let phi=180;
    if(!pass){ if(f>=16&&f<=21) phi=180-180*((f-15)/6); else if(f>=22&&f<=23) phi=0; else if(f>=24&&f<=29) phi=-180*((f-23)/6); }

    /* swinging toward the viewer: the nearer the stamp comes (sin), the bigger and lower it draws, so the turn reads as coming out of the frame, not behind the card */
    const near=1+.9*sn, drop=34*sn;

    /* the arm is always one piece from the collar to the stamp, whichever way it points */
    const at=10*near; armBar.set(Math.abs(co)<.4
      ? `M${PX-5} ${PY-5} L${PX+5} ${PY-5} L${f2(hx+at/2)} ${f2(hy)} L${f2(hx-at/2)} ${f2(hy)}Z`
      : `M${PX} ${PY-5} L${f2(hx)} ${f2(hy-at/2)} L${f2(hx)} ${f2(hy+at/2)} L${PX} ${PY+5}Z`);

    headPlate.set(sn>.6 ? rect(f2(hx-hw/2+6),f2(hy-hh/2+6),f2(hw-12),f2(hh-12),3) : rect(f2(co>=0?hx+hw/2-6:hx-hw/2-2),f2(hy-12*near),8,f2(24*near),2));
    collarStripe.setAttribute('d',rect(f2(88+22*(((phi%360)+360)%360/360)),BELT-74,3,24));
    /* the bar lifts out of the way for cards that pass */
    bar.style.opacity=(pass&&f>=22&&f<=27)?.35:1;
  }
  let last=-1; const t0=window.__machineT0 ?? performance.now();
  const tick=now=>{const F=Math.floor((now-t0)/1000*FPS); if(F!==last){last=F;render(F);} if(svg.isConnected) requestAnimationFrame(tick);};
  render(0); requestAnimationFrame(tick);
}

/* ---------- playback ---------- */
const stage=document.getElementById("stage"), hud=document.getElementById("hud"), hint=document.getElementById("hint");
let idx=0, started=false;
function fitStage(){ const s=Math.min(innerWidth/1600, innerHeight/900); stage.style.transform=`scale(${s}) translate(-50%,-50%)`; stage.style.transform=`translate(-50%,-50%) scale(${s})`; stage.style.transformOrigin="50% 50%"; stage.style.left="50%"; stage.style.top="50%"; }
/* a machine keeps running from beat to beat within one stop, so tapping from the doorway to the reveal doesn't restart it */
let lastShown=null;
function show(i, withSound=true){
  idx=Math.max(0,Math.min(beats.length-1,i));
  const b=beats[idx];
  stage.className=b.cls;
  const stopOf=k=>beats[k].label.split(" · ")[0];
  window.__fromPrev = lastShown!==null && idx===lastShown+1;
  if(!(lastShown!==null && idx===lastShown+1 && stopOf(lastShown)===stopOf(idx))) window.__machineT0=performance.now();
  lastShown=idx;
  stage.innerHTML=b.render();
  hud.textContent=`${idx+1} / ${beats.length} · ${b.label}`;
  clearTimeout(hopTimer); if(stage.classList.contains('after')) scheduleHop();
  if(stage.querySelector('#clBird')) mountClassBird();
  if(stage.querySelector('#stRobot')) mountRobot();
  mountSquirrel();
  stage.querySelectorAll('.fireLight').forEach(mountFire);
  stage.querySelectorAll('.bkFrags').forEach(mountBackFrags);
  const bm=stage.querySelector('#birdMount'); if(bm) mountBird(bm, ladleArm);
  const dm=stage.querySelector('#detMount'); if(dm) mountHeightGate(dm, detArm);
  const am=stage.querySelector('#aucMount'); if(am) mountAuction(am, aucArm);
  const tm=stage.querySelector('#tmMount'); if(tm) mountTreadmill(tm, tmArm);
  if(withSound && started && SOUND[b.sound]) SOUND[b.sound]();
}
/* now and then, a revealed operator gives a nervous little hop */
let hopTimer=null;
function scheduleHop(){ hopTimer=setTimeout(()=>{ const ops=[...stage.querySelectorAll('.op')]; if(ops.length){ const o=ops[Math.floor(Math.random()*ops.length)]; o.classList.add('hop'); setTimeout(()=>o.classList.remove('hop'),700);} scheduleHop(); }, 4000+Math.random()*7000); }
function next(){ if(!started){ started=true; hint.hidden=true; audio(); show(idx); return; } if(idx<beats.length-1) show(idx+1); }
function prev(){ if(idx>0) show(idx-1); }
addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==="h"||e.key==="H"){ hud.hidden=!hud.hidden; }
  else if(e.key==="m"||e.key==="M"){ muted=!muted; }
  else if(e.key==="f"||e.key==="F"){ const p=document.documentElement.requestFullscreen?.(); if(p&&p.catch) p.catch(()=>{}); }
  else if(/^[1-9]$/.test(e.key)){ const n=+e.key; const target=n===1?0:10+(n-2)*3; if(n<=7) show(target); }
});
document.getElementById("viewport").addEventListener("click",next);
addEventListener("resize",fitStage);
fitStage(); show(0,false);
</script>
