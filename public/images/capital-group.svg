  <title id="capital-group-title">Capital Group</title>

  <!-- Source was Capital Group's own site header markup: a wrapper <div>/<a>
       logo link, and the same <svg> defs (a gradient "squares" mark + a
       "Capital Group" wordmark, each a reusable <symbol>) rendered three
       times at different sizes/layouts with CSS visibility toggles for
       mobile/tablet/desktop. Kept only the defs and the "desktop" instance
       (icon stacked over wordmark, ~1.1:1 — closer to this site's 4:3 box
       than the wide mobile lockup) and dropped the rest. Nested in its own
       viewBox like the other logo fallbacks so it scales as a unit,
       undistorted, onto a canvas that already matches the card's aspect
       ratio — see parsons.svg for why that beats object-fit: cover here. -->
  <rect width="800" height="600" fill="#ffffff"/>

